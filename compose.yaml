name: credit-flow

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: "8080"
  RabbitMq__HostName: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__UserName: ${RABBITMQ_USER:?Copie .env.example para .env}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:?Configure RABBITMQ_PASSWORD no .env}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Configure SQL_PASSWORD no .env}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:${SQL_PORT:-1438}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Copie .env.example para .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Configure RABBITMQ_PASSWORD no .env}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  migrate-costumer:
    build:
      context: .
      target: migrations
      args:
        SERVICE: Costumer
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CostumerDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  migrate-credit:
    build:
      context: .
      target: migrations
      args:
        SERVICE: Credit
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CreditDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  migrate-card:
    build:
      context: .
      target: migrations
      args:
        SERVICE: Card
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CardDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  costumer:
    build:
      context: .
      target: runtime
      args:
        SERVICE: Costumer
    environment:
      <<: *api-environment
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CostumerDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;"
    ports:
      - "127.0.0.1:${COSTUMER_PORT:-5100}:8080"
    depends_on:
      migrate-costumer:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  credit:
    build:
      context: .
      target: runtime
      args:
        SERVICE: Credit
    environment:
      <<: *api-environment
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CreditDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;"
    ports:
      - "127.0.0.1:${CREDIT_PORT:-5200}:8080"
    depends_on:
      migrate-credit:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  card:
    build:
      context: .
      target: runtime
      args:
        SERVICE: Card
    environment:
      <<: *api-environment
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CardDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;"
    ports:
      - "127.0.0.1:${CARD_PORT:-5300}:8080"
    depends_on:
      migrate-card:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  test-costumer:
    profiles: [tests]
    build:
      context: .
      target: tests
      args:
        SERVICE: Costumer

  test-credit:
    profiles: [tests]
    build:
      context: .
      target: tests
      args:
        SERVICE: Credit

  test-card:
    profiles: [tests]
    build:
      context: .
      target: tests
      args:
        SERVICE: Card

volumes:
  sql-data:
  rabbit-data:
